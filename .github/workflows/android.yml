name: Android CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveCreatorStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare stable APK filename
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LiveCreatorStudio-debug.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "app/build/outputs/apk/debug/LiveCreatorStudio-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LiveCreator Studio build ${{ github.run_number }}" \
            --notes "Automated Android debug build from main. This APK is for controlled testing, not a production-signed Play Store release."
