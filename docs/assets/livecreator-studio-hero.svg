<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">LiveCreator Studio — conceptual dashboard artwork</title>
<desc id="desc">A dark, modern creator dashboard illustration with audio controls, a speech queue and a soundboard panel. This is conceptual artwork, not a product screenshot.</desc>
<defs>
